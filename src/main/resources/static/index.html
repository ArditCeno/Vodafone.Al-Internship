<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBi - Vodafone Albania</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .chat-header {
            background: #e60000;
            color: white;
            padding: 20px 30px;
            text-align: left;
            border-bottom: 3px solid #cc0000;
        }

        .chat-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.bot {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: #e60000;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message .intent {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .chat-input {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .chat-input input:focus {
            border-color: #e60000;
        }

        .chat-input button {
            background: #e60000;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .chat-input button:hover {
            background: #cc0000;
        }

        .chat-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .quick-actions {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid #eee;
        }

        .quick-actions button {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-actions button:hover {
            background: #e60000;
            color: white;
            border-color: #e60000;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 16px;
            align-self: flex-start;
            max-width: 60px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>TOBi</h1>
            <p>Vodafone Albania - Asistenti Dixhital</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Përshëndetje! Unë jam TOBi, asistenti juaj dixhital. Si mund t'ju ndihmoj sot?
            </div>
        </div>

        <div class="quick-actions">
            <button onclick="sendQuickMessage('Sa kredi kam?')">Balance</button>
            <button onclick="sendQuickMessage('Dua të bëj top-up')">Top-up</button>
            <button onclick="sendQuickMessage('Sa është fatura ime?')">Fatura</button>
            <button onclick="sendQuickMessage('Nuk kam internet')">Internet</button>
            <button onclick="sendQuickMessage('Dua të flas me agjent')">Agjent</button>
        </div>

        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Shkruani mesazhin..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendButton">Dërgo</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/tobi/chat';
        let sessionId = null;
        let userId = 'user-' + Math.random().toString(36).substr(2, 9);

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendQuickMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Show typing indicator
            showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        sessionId: sessionId,
                        userId: userId,
                        channel: 'web',
                        language: 'sq'
                    })
                });

                const data = await response.json();
                sessionId = data.sessionId;

                hideTyping();
                addMessage(data.message, 'bot', data.intent);

            } catch (error) {
                hideTyping();
                addMessage('Më falni, ndodhi një gabim. Ju lutem provoni përsëri.', 'bot', 'error');
            }
        }

        function addMessage(text, sender, intent = null) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender;
            
            let content = text;
            if (intent) {
                content += '<div class="intent">[' + intent + ']</div>';
            }
            
            messageDiv.innerHTML = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            document.getElementById('sendButton').disabled = true;
        }

        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
            document.getElementById('sendButton').disabled = false;
        }
    </script>
</body>
</html>
